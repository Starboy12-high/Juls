<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Cheap Data</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="../style.css"> <!-- Link to main site's style for consistency -->
    <link rel="stylesheet" href="admin_style.css">
</head>
<body class="admin-body"> <!-- Added admin-body class -->
    <div class="admin-login-container">
        <div class="card admin-login-card">
            <div class="card-body">
                <h3 class="card-title text-center mb-4">Admin Portal Login</h3>
                <form id="admin-login-form">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" class="form-control" id="username" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" class="form-control" id="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Login</button>
                </form>
                <p class="text-center mt-3"><a href="../index.html">&larr; Back to Main Site</a></p>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <!-- No global script.js from main site to avoid theme toggle/nav interference if not desired for admin -->
    <script>
        // Basic admin login placeholder (no actual authentication)
        document.getElementById('admin-login-form').addEventListener('submit', function(event) {
            event.preventDefault();
            // In a real application, send credentials to a backend for verification
            alert('Admin login attempt (placeholder). Redirecting to admin dashboard...');
            window.location.href = 'index.html'; // Or admin_dashboard.html
        });

        // Simple theme persistence for admin pages if main style.css is used
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }
    </script>
</body>
</html>
